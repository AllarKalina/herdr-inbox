id = "personal.inbox"
name = "Personal Inbox"
version = "0.9.0"
min_herdr_version = "0.9.1"
description = "Local spec-to-PR workflow inbox"
platforms = ["macos"]

[[build]]
platforms = ["macos"]
command = ["cargo", "build", "--release", "--locked", "--bin", "herdr-inbox"]

[[panes]]
id = "inbox"
# Herdr requires a nonempty title; a zero-width space leaves the frame unlabeled.
# The application renders its own anchored Inbox breadcrumb inside the popup.
title = "\u200B"
placement = "popup"
width = "85%"
height = "85%"
command = ["./target/release/herdr-inbox", "tui"]

[[actions]]
id = "open"
title = "Open inbox"
description = "Open the local workflow inbox"
command = ["./target/release/herdr-inbox", "open"]
