name: regress

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regress:
    # The plugin targets macOS only; the gate uses the same toolchain an install would.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Regression gate
        run: scripts/regress
      - name: Upload logs and rejected snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regress-logs
          path: |
            target/regress
            target/ui-snapshots-actual
